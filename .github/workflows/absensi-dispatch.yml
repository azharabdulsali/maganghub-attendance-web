name: Absensi Monev (dispatcher massal)

# Satu workflow ini melayani SEMUA user. Yang diperlukan:
#   - Secret repo: APP_URL   (mis. https://maganghub-autoabsen.my.id, tanpa slash)
#   - Secret repo: CRON_SECRET (sama persis dengan env di Vercel)
# User TIDAK perlu memasang apa pun, cukup menyalakan sakelar Otomasi di dashboard.
on:
  schedule:
    # Empat kali tiap jam: xx:00, xx:15, xx:30, xx:45 WIB (Jam Jakarta = UTC+7).
    # Server sendiri yang menyaring user mana yang jadwalnya jatuh pada jam
    # tersebut.
    #
    # KENAPA 4x, BUKAN 1x: penjadwal GitHub Actions TIDAK tepat waktu. Ia bisa
    # telat 10-30 menit saat runner sedang ramai, dan pada jam sibuk run bisa
    # di-skip sepenuhnya. Dengan pemicu sekali per jam, user yang jam
    # jadwalnya 07:xx hanya punya SATU kesempatan; bila pemicu itu telat ke
    # 07:45 atau hilang, absensinya baru terkirim pukul 08:xx — di luar jam
    # jadwalnya, sehingga server tidak memprosesnya sama sekali pada hari itu.
    # Dengan 4x per jam, jendela itu jadi <=15 menit.
    #
    # Aman dipanggil berlebih: user yang jam jadwalnya tidak cocok hanya
    # dilewati (tidak ada laporan terkirim), dan performSubmit punya penjaga
    # anti-duplikat, jadi panggilan tambahan tidak mengirim laporan ganda.
    - cron: "*/15 * * * *"
  # Memungkinkan memicu manual dari tab Actions untuk menguji.
  workflow_dispatch:

# Cegah dua run tumpang tindih bila run sebelumnya lambat.
concurrency:
  group: absensi-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Rahasia dibagikan di level JOB supaya SEMUA langkah (termasuk diagnostik)
    # menerimanya. Sebelumnya blok env hanya menempel pada langkah terakhir,
    # sehingga langkah diagnostik melihat variabel yang tidak terdefinisi.
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Diagnostik rahasia (tanpa membocorkan nilai)
        run: |
          # Tujuan: membedakan "secret kosong" vs "secret ada spasi/baris baru
          # tak sengaja" vs "secret beda nilai". AMAN: hanya panjang (jumlah
          # karakter) dan sifat karakter ujung yang dicetak — NILAI rahasia
          # tidak pernah ditampilkan.
          # (sengaja TIDAK memakai `set -u`: secret yang belum diset di GitHub
          #  disubstitusi menjadi kosong/hilang, dan `set -u` akan menjatuhkan
          #  skrip sebelum sempat melaporkan apa pun.)
          #
          # Normalisasi: bila secret tidak diset, variabel bisa benar-benar tak
          # ada. Salin ke variabel lokal dengan default kosong supaya aman.
          url="${APP_URL:-}"
          secret="${CRON_SECRET:-}"

          echo "APP_URL  : panjang=${#url} char"
          echo "CRON_SECRET: panjang=${#secret} char"

          # Deteksi spasi/baris baru di ujung (penyebab 401 paling umum).
          case "$url" in
            *[[:space:]]) echo "  PERINGATAN: APP_URL berakhir dengan spasi/baris baru." ;;
            "")           echo "  PERINGATAN: APP_URL KOSONG (secret belum diset di GitHub)." ;;
          esac
          case "$secret" in
            *[[:space:]]) echo "  PERINGATAN: CRON_SECRET berakhir dengan spasi/baris baru." ;;
            "")           echo "  PERINGATAN: CRON_SECRET KOSONG (secret belum diset di GitHub)." ;;
          esac

          # Panjang lazim CRON_SECRET: 64 (randomBytes(32).toString('hex')).
          if [ "${#secret}" -ne 64 ] && [ "${#secret}" -ne 0 ]; then
            echo "  CATATAN: panjang CRON_SECRET bukan 64; pastikan sengaja."
          fi

          if [ "${#secret}" -eq 0 ] || [ -z "$url" ]; then
            echo "::error::Secret GitHub belum lengkap (APP_URL kosong atau CRON_SECRET kosong)."
            exit 1
          fi

      - name: Panggil dispatcher
        run: |
          set -euo pipefail

          # -L (--location): IKUTI redirect. Tanpa ini, APP_URL yang cocok
          #   dengan aturan redirect (mis. http→https atau non-www→www) membalas
          #   3xx dan curl berhenti di situ: kode != 200 → run gagal, padahal
          #   aplikasinya sehat. Ini pernah terjadi (HTTP 308).
          #   PENTING: saat redirect LINTAS-HOST (mis. non-www → www), header
          #   Authorization DIBUANG di tengah jalan → server melihat request
          #   tanpa token → 401 meski CRON_SECRET sudah benar. Karena itu APP_URL
          #   HARUS host final tanpa redirect; -L hanya sabuk pengaman.
          # %{url_effective}: host terakhir setelah redirect. Dicetak agar terlihat
          #   bila host berubah (penyebab 401 yang menyesatkan).
          code=$(curl -sS -L -o response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/run-all")
          final_url=$(curl -sS -L -o /dev/null -w "%{url_effective}" "${APP_URL}/api/cron/run-all")
          echo "HTTP $code"
          echo "URL akhir: $final_url"
          cat response.json
          echo

          if [ "$code" = "200" ]; then
            exit 0
          fi

          echo "::error::Dispatcher tidak membalas 200 (dapat $code), gagal."
          case "$code" in
            308|301|302|303|307)
              echo "Diagnosis: APP_URL di GitHub Secrets masih kena redirect."
              echo "  Perbaikan: set APP_URL tepat ke HOST FINAL hasil redirect"
              echo "  (mis. bila 308 mengarah ke 'www.', pakai 'https://www....'),"
              echo "  https, TANPA slash di akhir. Bila perlu:"
              echo "    curl -sS -o /dev/null -w \"%{url_effective}\" -L \"\$APP_URL\""
              ;;
            401)
              echo "Diagnosis: server menerima request TANPA/menolak token."
              echo "  Panjang di GitHub: ${#CRON_SECRET} char."
              echo "  Dua sebab tersering:"
              echo "   (a) APP_URL di-redirect lintas-host (non-www→www) sehingga header"
              echo "       Authorization dibuang. URL akhir: $final_url"
              echo "       → set APP_URL ke host final persis."
              echo "   (b) CRON_SECRET GitHub ≠ Vercel. Set nilai sama di keduanya,"
              echo "       lalu REDEPLOY Vercel (nilai baru tak berlaku tanpa redeploy)."
              ;;
            503)
              echo "Diagnosis: CRON_SECRET belum diset di Vercel (atau belum redeploy)."
              echo "  Perbaikan: set di Vercel lalu REDEPLOY."
              ;;
            *)
              echo "Lihat docs/CRON-BULK.md bagian 'Arti kode respons'."
              ;;
          esac
          exit 1
